<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SeatSync | Exam & Hall Details</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header class="header">
        <div class="logo">
            SeatSync
            <span>Examination Portal</span>
        </div>
    </header>


    <main class="container">

        <div class="page-title">
            <h1>Exam & Hall Details</h1>

            <p>
                Enter the examination details and add all available examination halls.
            </p>
        </div>


        <form
            action="/save-exam-hall"
            method="POST"
            id="exam-hall-form"
        >

            <!-- EXAM DETAILS -->

            <div class="card">

                <h2>Exam Details</h2>

                <div class="form-group">

                    <label for="exam_name">
                        Exam Name
                    </label>

                    <input
                        type="text"
                        id="exam_name"
                        name="exam_name"
                        placeholder="Example: Internal Assessment - I"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="exam_date">
                        Exam Date
                    </label>

                    <input
                        type="date"
                        id="exam_date"
                        name="exam_date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="exam_time">
                        Exam Time
                    </label>

                    <input
                        type="time"
                        id="exam_time"
                        name="exam_time"
                        required
                    >

                </div>

            </div>


            <!-- EXAMINATION HALLS -->

            <div class="card">

                <div class="section-header">

                    <div>

                        <h2>
                            Examination Halls
                        </h2>

                        <p>
                            Add all halls that are available for this examination.
                        </p>

                    </div>

                    <div class="hall-count">
                        Halls:
                        <span id="hall-count">1</span>
                    </div>

                </div>


                <div id="hall-container">

                    <!-- HALL 1 -->

                    <div
                        class="hall-card"
                        data-hall-number="1"
                    >

                        <div class="hall-card-header">

                            <h3>
                                Hall 1
                            </h3>

                        </div>


                        <div class="form-group">

                            <label>
                                Hall Name
                            </label>

                            <input
                                type="text"
                                name="hall_name"
                                placeholder="Example: C402"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Number of Rows
                            </label>

                            <input
                                type="number"
                                name="rows"
                                min="1"
                                placeholder="Example: 5"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Number of Columns
                            </label>

                            <input
                                type="number"
                                name="columns"
                                min="1"
                                placeholder="Example: 10"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label>
                                Seats per Bench
                            </label>

                            <input
                                type="number"
                                name="seats_per_bench"
                                min="1"
                                max="2"
                                value="2"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- ADD HALL -->

                <div class="hall-actions">

                    <button
                        type="button"
                        class="secondary-button"
                        onclick="addHall()"
                    >
                        + Add Another Hall
                    </button>

                </div>

            </div>


            <!-- CONTINUE -->

            <div class="action-area">

                <button type="submit">
                    Review Exam & Hall Summary →
                </button>

            </div>

        </form>

    </main>


    <footer class="footer">

        SeatSync &nbsp;|&nbsp;
        Examination Seating Management Portal

    </footer>


    <script>

        let hallNumber = 1;


        function addHall() {

            hallNumber++;

            const hallContainer =
                document.getElementById("hall-container");


            const hallCard =
                document.createElement("div");

            hallCard.className = "hall-card";

            hallCard.setAttribute(
                "data-hall-number",
                hallNumber
            );


            hallCard.innerHTML = `

                <div class="hall-card-header">

                    <h3>
                        Hall ${hallNumber}
                    </h3>

                    <button
                        type="button"
                        class="remove-hall-button"
                        onclick="removeHall(this)"
                    >
                        Remove
                    </button>

                </div>


                <div class="form-group">

                    <label>
                        Hall Name
                    </label>

                    <input
                        type="text"
                        name="hall_name"
                        placeholder="Example: C403"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Number of Rows
                    </label>

                    <input
                        type="number"
                        name="rows"
                        min="1"
                        placeholder="Example: 5"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Number of Columns
                    </label>

                    <input
                        type="number"
                        name="columns"
                        min="1"
                        placeholder="Example: 10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Seats per Bench
                    </label>

                    <input
                        type="number"
                        name="seats_per_bench"
                        min="1"
                        max="2"
                        value="2"
                        required
                    >

                </div>

            `;


            hallContainer.appendChild(hallCard);

            updateHallCount();
        }


        function removeHall(button) {

            const hallCard =
                button.closest(".hall-card");


            if (!hallCard) {
                return;
            }


            hallCard.remove();

            renumberHalls();
        }


        function renumberHalls() {

            const halls =
                document.querySelectorAll(".hall-card");


            halls.forEach(function(hall, index) {

                const number = index + 1;


                hall.setAttribute(
                    "data-hall-number",
                    number
                );


                const heading =
                    hall.querySelector(
                        ".hall-card-header h3"
                    );


                if (heading) {

                    heading.textContent =
                        `Hall ${number}`;

                }

            });


            hallNumber = halls.length;

            updateHallCount();
        }


        function updateHallCount() {

            const halls =
                document.querySelectorAll(".hall-card");


            document.getElementById(
                "hall-count"
            ).textContent = halls.length;
        }

    </script>

</body>

</html>
